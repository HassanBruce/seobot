# Runs once and exits. The server's cron starts it every morning:
#   docker compose run --rm seobot
name: seobot
services:
  seobot:
    build: .
    env_file: .env
    environment:
      DATA_DIR: /app/data
      GSC_KEY_FILE: /app/secrets/gsc.json
      TUBEBOT_DB: /tubebot/tubebot.db
    volumes:
      - ./data:/app/data
      - ../secrets:/app/secrets:ro
      - ./sites.json:/app/sites.json:ro
      - /var/www/tubebot/src/data:/tubebot:ro
